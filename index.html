<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Asisten Perawat</title>
  
  <!-- TAG ANTI-CACHE -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <script>
    window.addEventListener('pageshow', function (event) {
      if (event.persisted) { window.location.reload(); }
    });
  </script>

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: #eef2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }
    .app-card {
      background: #ffffff;
      width: 100%;
      max-width: 450px;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }
    
    /* NAVIGASI TAB MENU */
    .tab-nav {
      display: flex;
      gap: 5px;
      margin-bottom: 15px;
      border-bottom: 2px solid #eef2f5;
      padding-bottom: 8px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px 5px;
      background: #e9ecef;
      color: #495057;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: #0d6efd;
      color: white;
    }

    /* KONTEN TAB */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    h2 {
      margin: 0 0 15px 0;
      color: #0d6efd;
      font-size: 16px;
      text-align: center;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .full-width { grid-column: span 2; }
    .form-group { margin-bottom: 8px; }
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 3px;
      color: #495057;
      text-transform: uppercase;
    }
    input, select, textarea {
      width: 100%;
      padding: 7px 9px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 2px rgba(13, 110, 253, 0.15);
    }
    .vital-sign {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
    }
    .vital-sign input {
      padding: 6px 4px;
      text-align: center;
      font-size: 12px;
    }
    .o2-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 6px;
      background: #f8f9fa;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #e9ecef;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }
    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-submit { background-color: #0d6efd; color: white; }
    .btn-submit:hover { background-color: #0b5ed7; }
    .btn-reset { background-color: #6c757d; color: white; }
    .btn-reset:hover { background-color: #5c636a; }
    
    .preview-box {
      margin-top: 15px;
      padding: 10px;
      background: #f8f9fa;
      border: 1px dashed #adb5bd;
      border-radius: 6px;
      font-size: 12px;
      white-space: pre-wrap;
      word-wrap: break-word;
      color: #212529;
      display: none;
    }
    .status-alert {
      margin-top: 8px;
      font-size: 12px;
      text-align: center;
      font-weight: bold;
      color: #198754;
    }
  </style>
</head>
<body>

  <div class="app-card">
    
    <!-- MENU TAB ATAS -->
    <div class="tab-nav">
      <button class="tab-btn active" onclick="switchTab('tabLapor')">📋 Lapor Dokter</button>
      <button class="tab-btn" onclick="switchTab('tabResep')">💊 E-Resep</button>
    </div>

    <!-- ================= TAB 1: LAPOR DOKTER ================= -->
    <div id="tabLapor" class="tab-content active">
      <h2>📋 Form Lapor Dokter</h2>
      
      <form id="formLapor">
        <div class="form-grid">
          <div class="form-group full-width">
            <label>Asal Unit</label>
            <select id="asalUnit" required>
              <option value="">-- Pilih Unit --</option>
              <option value="IGD">IGD</option>
              <option value="HD">HD</option>
              <option value="KABER">KABER</option>
              <option value="RPS">RPS</option>
              <option value="RICT">RICT</option>
              <option value="UPI">UPI</option>
              <option value="Rajal">Rajal</option>
            </select>
          </div>

          <div class="form-group full-width">
            <label>Nama Pasien</label>
            <input type="text" id="namaPasien" placeholder="Contoh: Bpk. Hadi" required>
          </div>

          <div class="form-group full-width">
            <label>Diagnosa</label>
            <input type="text" id="diagnosa" placeholder="Contoh: CHF" required>
          </div>

          <div class="form-group full-width">
            <label>Keluhan Utama Saat Ini</label>
            <textarea id="keluhan" rows="2" placeholder="Contoh: Nyeri dada" required></textarea>
          </div>

          <div class="form-group full-width">
            <label>Tanda Vital (TD / N / RR / S / SpO2)</label>
            <div class="vital-sign">
              <input type="text" id="td" placeholder="TD">
              <input type="text" id="n" placeholder="N">
              <input type="text" id="rr" placeholder="RR">
              <input type="text" id="s" placeholder="S">
              <input type="text" id="spo2" placeholder="SpO2">
            </div>

            <div class="o2-group">
              <div>
                <label>Bantuan O2</label>
                <select id="opsiO2" onchange="toggleO2Input()">
                  <option value="Tanpa O2">Tanpa O2</option>
                  <option value="Dengan O2">Dengan O2</option>
                </select>
              </div>
              <div id="boxDosisO2" style="display: none;">
                <label>Dosis / Alat O2</label>
                <input type="text" id="dosisO2" placeholder="Cth: NRBM 8lpm">
              </div>
            </div>
          </div>

          <div class="form-group full-width">
            <label>Tx IGD (Terapi dari IGD)</label>
            <textarea id="txIgd" rows="2" placeholder="Contoh: Injeksi Furosemid 20mg"></textarea>
          </div>

          <div class="form-group full-width">
            <label>Dokter DPJP di IGD</label>
            <input type="text" id="dokterIgd" list="daftarDokter" placeholder="Ketik nama dokter..." autocomplete="off">
          </div>

          <div class="form-group full-width">
            <label>Advis Dokter di IGD</label>
            <textarea id="advisIgd" rows="2" placeholder="Contoh: Cek EKG ulang"></textarea>
          </div>

          <div class="form-group full-width">
            <label>RPD</label>
            <input type="text" id="rpd" placeholder="Contoh: HT">
          </div>

          <div class="form-group full-width">
            <label>RPO</label>
            <input type="text" id="rpo" placeholder="Contoh: Amlodipin 10mg">
          </div>

          <div class="form-group full-width">
            <label>Rencana Tindakan</label>
            <textarea id="rencana" rows="2" placeholder="Contoh: Rencana USG ABD"></textarea>
          </div>
        </div>

        <div class="btn-group">
          <button type="button" class="btn-reset" onclick="resetForm('formLapor')">Reset</button>
          <button type="submit" class="btn-submit">📋 Salin Format Lapor</button>
        </div>
      </form>

      <div id="statusLapor" class="status-alert"></div>
      <div id="previewLapor" class="preview-box"></div>
    </div>


    <!-- ================= TAB 2: PERMINTAAN E-RESEP ================= -->
    <div id="tabResep" class="tab-content">
      <h2>💊 Form Permintaan E-Resep</h2>
      
      <form id="formResep">
        <div class="form-grid">
          
          <div class="form-group">
            <label>No. RM</label>
            <input type="text" id="noRm" placeholder="Cth: 12-34-56" required>
          </div>

          <div class="form-group">
            <label>Nama Pasien</label>
            <input type="text" id="namaPasienResep" placeholder="Cth: Tn. Ahmad" required>
          </div>

          <div class="form-group full-width">
            <label>Daftar Obat / Permintaan Resep</label>
            <textarea id="daftarObat" rows="5" placeholder="Ketik obat di sini...&#10;Contoh:&#10;- Amlodipin 10mg 1x1&#10;- Paracetamol 500mg 3x1" required></textarea>
          </div>

        </div>

        <div class="btn-group">
          <button type="button" class="btn-reset" onclick="resetForm('formResep')">Reset</button>
          <button type="submit" class="btn-submit">💊 Salin Format E-Resep</button>
        </div>
      </form>

      <div id="statusResep" class="status-alert"></div>
      <div id="previewResep" class="preview-box"></div>
    </div>

    <!-- DATALIST NAMA DOKTER (DIPAKAI BERSAMA) -->
    <datalist id="daftarDokter">
      <option value="dokter jaga"></option>
      <option value="dr. Syafira, Sp.N"></option>
      <option value="dr. Widodo, Sp.N"></option>
      <option value="dr. Kiki, Sp.N"></option>
      <option value="dr. Surya, Sp.THT-KL"></option>
      <option value="dr. Stefani, Sp.THT-KL"></option>
      <option value="dr. Aditya, Sp.THT-KL"></option>
      <option value="dr. Sigit, Sp.BP-RE"></option>
      <option value="dr. Ratna, Sp.DVE"></option>
      <option value="dr. Eva, Sp.DVE"></option>
      <option value="dr. Dearisa, Sp.KJ"></option>
      <option value="dr. Azizah, Sp.KJ"></option>
      <option value="drg. Fredy, Sp.BM"></option>
      <option value="drg. Fitriana, Sp.BM"></option>
      <option value="dr. Barlian, Sp.KFR"></option>
      <option value="dr. Nunik, Sp.KFR"></option>
      <option value="dr. Retno, Sp.OG"></option>
      <option value="dr. Irwan, Sp.OG"></option>
      <option value="dr. Zaki, Sp.OG"></option>
      <option value="dr. Yayuk, Sp.OG"></option>
      <option value="dr. Ariya, Sp.OG"></option>
      <option value="dr. Nurike, Sp.PD"></option>
      <option value="dr. Nur Samsu, Sp.PD-KGH"></option>
      <option value="dr. Dyah, Sp.PD"></option>
      <option value="dr. Ogit, Sp.PD"></option>
      <option value="dr. Rama, Sp.PD"></option>
      <option value="dr. Bondan, Sp.PD"></option>
      <option value="dr. Bayu, Sp.PD"></option>
      <option value="dr. Aji, Sp.OT"></option>
      <option value="dr. Rangga, Sp.OT"></option>
      <option value="dr. Amukti, Sp.B"></option>
      <option value="dr. Sinda, Sp.B"></option>
      <option value="dr. Haiman, Sp.B"></option>
      <option value="dr. Bara, Sp.B"></option>
      <option value="dr. Yahya, Sp.BS"></option>
      <option value="dr. Wildan, Sp.BS"></option>
      <option value="dr. Imam, Sp.BTKV"></option>
      <option value="dr. Tedjo, Sp.B-KBD"></option>
      <option value="dr. Heru, Sp.B-KBD"></option>
      <option value="dr. Tohir, Sp.M"></option>
      <option value="dr. Catur, Sp.M"></option>
      <option value="dr. Yasmin, Sp.M"></option>
      <option value="dr. Mirza, Sp.M"></option>
      <option value="dr. Arief Budi, Sp.JP"></option>
      <option value="dr. Ardian, Sp.JP"></option>
      <option value="dr. Evelyn, Sp.JP"></option>
      <option value="dr. Harnanik, Sp.JP"></option>
      <option value="dr. Hendri, Sp.P"></option>
      <option value="dr. Siti, Sp.P"></option>
      <option value="dr. Rhomdhon, Sp.U"></option>
      <option value="dr. Ifad, Sp.U"></option>
    </datalist>

  </div>

  <script>
    // Fungsi Pindah Tab
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');
    }

    function toggleO2Input() {
      const opsiO2 = document.getElementById('opsiO2').value;
      const boxDosis = document.getElementById('boxDosisO2');
      if (opsiO2 === 'Dengan O2') {
        boxDosis.style.display = 'block';
      } else {
        boxDosis.style.display = 'none';
        document.getElementById('dosisO2').value = '';
      }
    }

    // Submit Lapor Dokter
    document.getElementById('formLapor').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const unit = document.getElementById('asalUnit').value;
      const nama = document.getElementById('namaPasien').value;
      const diag = document.getElementById('diagnosa').value;
      const keluhan = document.getElementById('keluhan').value;
      
      const td = document.getElementById('td').value || '-';
      const n = document.getElementById('n').value || '-';
      const rr = document.getElementById('rr').value || '-';
      const s = document.getElementById('s').value || '-';
      
      const spo2Val = document.getElementById('spo2').value || '-';
      const opsiO2 = document.getElementById('opsiO2').value;
      const dosisO2 = document.getElementById('dosisO2').value;

      let ketO2 = `${spo2Val}%`;
      if (opsiO2 === 'Dengan O2' && dosisO2) {
        ketO2 += ` (${opsiO2} ${dosisO2})`;
      } else if (opsiO2 === 'Dengan O2') {
        ketO2 += ` (${opsiO2})`;
      }

      const txIgd = document.getElementById('txIgd').value || '-';
      const dokterIgd = document.getElementById('dokterIgd').value || 'Dokter';
      const advisIgd = document.getElementById('advisIgd').value || '-';
      const rpd = document.getElementById('rpd').value || '-';
      const rpo = document.getElementById('rpo').value || '-';
      const rencana = document.getElementById('rencana').value || '-';

      const formatTeks = `Assalamualaikum dokter melaporkan pasien baru pindahan dari ${unit} atas nama ${nama} dengan ${diag}

keluhan saat ini ${keluhan}

TD: ${td}
N: ${n}
RR: ${rr}
S: ${s}
SpO2: ${ketO2}

Tx igd:
${txIgd}

Advis dari ${dokterIgd} di igd:
${advisIgd}

RPD: ${rpd}
RPO: ${rpo}

rencana tindakan ${rencana}

Penunjang terlampir, apakah ada advis tambahan dokter? terimakasih🙏`;

      copyToClipboard(formatTeks, 'statusLapor', 'previewLapor');
    });

    // Submit E-Resep
    document.getElementById('formResep').addEventListener('submit', function(e) {
      e.preventDefault();

      const dokter = document.getElementById('dokterResep').value;
      const noRm = document.getElementById('noRm').value;
      const nama = document.getElementById('namaPasienResep').value;
      const obat = document.getElementById('daftarObat').value;

      // Format E-Resep Sesuai Permintaan
      const formatResep = `Assalamualaikum ${dokter} minta eresep (${noRm}) // (${nama})
${obat}

Terimakasih 🙏`;

      copyToClipboard(formatResep, 'statusResep', 'previewResep');
    });

    // Helper Copy ke Clipboard
    function copyToClipboard(text, statusId, previewId) {
      navigator.clipboard.writeText(text).then(() => {
        const status = document.getElementById(statusId);
        const preview = document.getElementById(previewId);
        
        status.innerText = '✅ Teks berhasil disalin! Tinggal Paste di WA';
        preview.style.display = 'block';
        preview.innerText = text;

        setTimeout(() => { status.innerText = ''; }, 4000);
      }).catch(err => {
        alert('Gagal menyalin otomatis, silakan salin manual.');
      });
    }

    function resetForm(formId) {
      document.getElementById(formId).reset();
      if(formId === 'formLapor') {
        document.getElementById('previewLapor').style.display = 'none';
        document.getElementById('statusLapor').innerText = '';
        toggleO2Input();
      } else {
        document.getElementById('previewResep').style.display = 'none';
        document.getElementById('statusResep').innerText = '';
      }
    }
  </script>
</body>
</html>
