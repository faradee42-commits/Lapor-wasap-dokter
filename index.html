<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lapor Dokter</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: #eef2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }
    .app-card {
      background: #ffffff;
      width: 100%;
      max-width: 420px; /* Ukuran kotak kecil/compact */
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }
    h2 {
      margin: 0 0 15px 0;
      color: #0d6efd;
      font-size: 18px;
      text-align: center;
      border-bottom: 2px solid #eef2f5;
      padding-bottom: 10px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .full-width { grid-column: span 2; }
    .form-group { margin-bottom: 8px; }
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 3px;
      color: #495057;
      text-transform: uppercase;
    }
    input, select, textarea {
      width: 100%;
      padding: 7px 9px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 2px rgba(13, 110, 253, 0.15);
    }
    .vital-sign {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
    }
    .vital-sign input {
      padding: 6px 4px;
      text-align: center;
      font-size: 12px;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }
    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-submit { background-color: #0d6efd; color: white; }
    .btn-submit:hover { background-color: #0b5ed7; }
    .btn-reset { background-color: #6c757d; color: white; }
    .btn-reset:hover { background-color: #5c636a; }
    
    /* Area Preview Teks */
    .preview-box {
      margin-top: 15px;
      padding: 10px;
      background: #f8f9fa;
      border: 1px dashed #adb5bd;
      border-radius: 6px;
      font-size: 12px;
      white-space: pre-wrap;
      word-wrap: break-word;
      color: #212529;
      display: none;
    }
    #statusAlert {
      margin-top: 8px;
      font-size: 12px;
      text-align: center;
      font-weight: bold;
      color: #198754;
    }
  </style>
</head>
<body>

  <div class="app-card">
    <h2>📋 Form Lapor Dokter</h2>
    
    <form id="formLapor">
      <div class="form-grid">
        
        <div class="form-group full-width">
          <label>Asal Unit (1)</label>
          <select id="asalUnit" required>
            <option value="">-- Pilih Unit --</option>
            <option value="IGD">IGD</option>
            <option value="HD">HD</option>
            <option value="KABER">KABER</option>
            <option value="RPS">RPS</option>
            <option value="RICT">RICT</option>
            <option value="UPI">UPI</option>
          </select>
        </div>

        <div class="form-group full-width">
          <label>Nama Pasien (2)</label>
          <input type="text" id="namaPasien" placeholder="Contoh: Bpk. Ahmad (45 th)" required>
        </div>

        <div class="form-group full-width">
          <label>Diagnosa (3)</label>
          <input type="text" id="diagnosa" placeholder="Contoh: Dyspnea ec CHF" required>
        </div>

        <div class="form-group full-width">
          <label>Keluhan Utama (4)</label>
          <textarea id="keluhan" rows="2" placeholder="Tuliskan keluhan saat ini..." required></textarea>
        </div>

        <!-- Tanda Vital / Vital Signs -->
        <div class="form-group full-width">
          <label>Tanda Vital (5 - 9)</label>
          <div class="vital-sign">
            <input type="text" id="td" placeholder="TD" title="Tekanan Darah">
            <input type="text" id="n" placeholder="N" title="Nadi">
            <input type="text" id="rr" placeholder="RR" title="Laju Napas">
            <input type="text" id="s" placeholder="S" title="Suhu">
            <input type="text" id="spo2" placeholder="SpO2" title="Saturasi Oksigen">
          </div>
        </div>

        <div class="form-group full-width">
          <label>Riwayat Penyakit Dahulu / RPD (10)</label>
          <input type="text" id="rpd" placeholder="Contoh: HT (+), DM (-)">
        </div>

        <div class="form-group full-width">
          <label>Riwayat Pengobatan / RPO (11)</label>
          <input type="text" id="rpo" placeholder="Contoh: Amlodipine 1x10mg">
        </div>

        <div class="form-group full-width">
          <label>Rencana / Rencana Tindakan (12)</label>
          <textarea id="rencana" rows="2" placeholder="Contoh: O2 NCK 3 lpm, IVFD RL 20 tpm"></textarea>
        </div>

      </div>

      <div class="btn-group">
        <button type="button" class="btn-reset" onclick="resetForm()">Reset</button>
        <button type="submit" class="btn-submit">📋 Salin Teks Format</button>
      </div>
    </form>

    <div id="statusAlert"></div>
    <div id="preview" class="preview-box"></div>
  </div>

  <script>
    document.getElementById('formLapor').addEventListener('submit', function(e) {
      e.preventDefault();
      
      // Ambil Nilai Form
      const unit = document.getElementById('asalUnit').value;
      const nama = document.getElementById('namaPasien').value;
      const diag = document.getElementById('diagnosa').value;
      const keluhan = document.getElementById('keluhan').value;
      
      const td = document.getElementById('td').value || '-';
      const n = document.getElementById('n').value || '-';
      const rr = document.getElementById('rr').value || '-';
      const s = document.getElementById('s').value || '-';
      const spo2 = document.getElementById('spo2').value || '-';

      const rpd = document.getElementById('rpd').value || '-';
      const rpo = document.getElementById('rpo').value || '-';
      const rencana = document.getElementById('rencana').value || '-';

      // Susun Format Teks WhatsApp
      const formatTeks = `Assalamualaikum dokter melaporkan pasien baru pindahan dari ${unit} atas nama ${nama} dengan ${diag}

keluhan saat ini ${keluhan}

TD: ${td}
N: ${n}
RR: ${rr}
S: ${s}
SpO2: ${spo2}%

RPD: ${rpd}
RPO: ${rpo}

rencana tindakan ${rencana}

Penunjang terlampir, apakah ada advis tambahan dokter? terimakasih🙏`;

      // Copy ke Clipboard Perangkat (Mac/Windows/Android)
      navigator.clipboard.writeText(formatTeks).then(() => {
        const status = document.getElementById('statusAlert');
        const preview = document.getElementById('preview');
        
        status.innerText = '✅ Teks berhasil disalin! Tinggal Paste di WA';
        preview.style.display = 'block';
        preview.innerText = formatTeks;

        setTimeout(() => {
          status.innerText = '';
        }, 4000);
      }).catch(err => {
        alert('Gagal menyalin otomatis, silakan salin manual.');
      });
    });

    function resetForm() {
      document.getElementById('formLapor').reset();
      document.getElementById('preview').style.display = 'none';
      document.getElementById('statusAlert').innerText = '';
    }
  </script>
</body>
</html>
